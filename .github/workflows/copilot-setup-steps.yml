name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install system packages for Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libxss1 libasound2 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxrandr2 libgbm1 libgtk-3-0 libx11-xcb1 \
            fonts-liberation libpangocairo-1.0-0 libgdk-pixbuf2.0-0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrender1 libxinerama1 libxcursor1 \
            ca-certificates
          sudo rm -rf /var/lib/apt/lists/*

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/autoalpha/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r autoalpha/requirements.txt

      - name: Install Playwright browsers and drivers
        run: |
          python -m playwright install --with-deps

      - name: Verify installation
        run: |
          python - <<'PY'
import sys
try:
  import playwright
  print('playwright OK', getattr(playwright, '__version__', 'unknown'))
except Exception as e:
  print('playwright import failed:', e)
  sys.exit(1)
PY

      - name: Quick smoke (list scripts)
        run: |
          ls -la autoalpha/scripts || true
